name: 'Build & Test'

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
        include:
          - os: ubuntu-latest
            node-version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Compile, lint, and test
        run: npm test -- --runInBand

  package:
    name: Package VSIX
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Package extension
        run: npm run package:vsix -- --out vscode-numpy-viewer.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vscode-numpy-viewer-${{ github.sha }}
          path: vscode-numpy-viewer.vsix
          if-no-files-found: error
          retention-days: 14
